name: Publish to Thunderstore

on:
  workflow_dispatch:

concurrency:
  group: thunderstore-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify package DLL
        run: |
          test -f package/SkillScale.dll || {
            echo "Missing package/SkillScale.dll"
            exit 1
          }

      - name: Install tcli
        run: dotnet tool install -g tcli

      - name: Publish
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_API_KEY }}
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          if [ -z "$TCLI_AUTH_TOKEN" ]; then
            echo "THUNDERSTORE_API_KEY secret is empty"
            exit 1
          fi
          tcli publish --config-path thunderstore.toml --token "$TCLI_AUTH_TOKEN"
